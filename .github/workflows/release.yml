name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run typecheck && npm test
      - run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: bash scripts/package.sh
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/fastproxy-*.tar.gz dist/SHA256SUMS scripts/install.sh --verify-tag --generate-notes
