name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run typecheck && npm run build && npm test
      - run: sudo apt-get update && sudo apt-get install -y nftables iproute2 jq
      - run: sudo bash scripts/test-install.sh
      - run: sudo env FASTPROXY_TEST_NODE="$(command -v node)" bash scripts/test-install.sh --real
      - run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" scripts/install.sh --verify-tag --generate-notes
