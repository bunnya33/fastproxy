name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run build && npm test
      - run: npm audit --omit=dev
      - run: sudo apt-get update && sudo apt-get install -y haproxy iproute2 jq shellcheck
      - run: bash -n scripts/install.sh scripts/fastproxy scripts/start scripts/test-install.sh
      - run: shellcheck scripts/install.sh scripts/fastproxy scripts/start scripts/test-systemd.sh scripts/test-install.sh
      - run: sudo bash scripts/test-install.sh
      - run: sudo env FASTPROXY_TEST_NODE="$(command -v node)" bash scripts/test-install.sh --real
      - run: sudo env FASTPROXY_TEST_NODE="$(command -v node)" bash scripts/test-systemd.sh
      - run: sudo unshare --mount --net --fork env FASTPROXY_INTEGRATION=1 "$(command -v node)" --test apps/server/dist-test/test/network.test.js
  ubuntu20:
    name: Ubuntu 20.04 compatibility
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --privileged
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - run: apt-get update -qq && apt-get install -y -qq ca-certificates curl git jq libstdc++6 haproxy iproute2 systemd xz-utils openssl
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --version && haproxy -v && ldd --version
      - run: npm ci && npm test
      - run: bash scripts/test-install.sh
      - run: bash scripts/test-install.sh --real
      - run: unshare --mount --net --fork env FASTPROXY_INTEGRATION=1 "$(command -v node)" --test apps/server/dist-test/test/network.test.js
      - name: Check systemd 245 unit compatibility
        run: |
          mkdir -p /opt/fastproxy /etc/fastproxy /var/lib/fastproxy /run/fastproxy
          touch /etc/fastproxy/fastproxy.env
          sed 's|ExecStart=.*|ExecStart=/bin/true|' scripts/fastproxy.service > /run/fastproxy-compat.service
          systemd-analyze verify /run/fastproxy-compat.service
