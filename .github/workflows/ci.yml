name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run build && npm test
      - run: npm audit --omit=dev
      - run: sudo apt-get update && sudo apt-get install -y nftables iproute2 jq shellcheck
      - run: bash -n scripts/install.sh scripts/fastproxy scripts/package.sh scripts/start
      - run: shellcheck scripts/install.sh scripts/fastproxy scripts/package.sh scripts/start scripts/test-systemd.sh
      - run: sudo unshare --mount --net --fork env FASTPROXY_INTEGRATION=1 "$(command -v node)" --test apps/server/dist-test/test/network.test.js
